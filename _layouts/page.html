---
layout: default
---

<article class="page container container--narrow">
  <header class="page__header">
    <p class="eyebrow">{{ page.eyebrow | default: 'ABOUT' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
