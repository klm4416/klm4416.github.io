---
layout: default
---

<article class="page">
  <header class="page__header">
    <div class="container container--article page__header-inner">
      <p class="story-kicker">PAGE / {{ page.eyebrow | default: 'ABOUT' }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p>{{ page.description }}</p>
      {% endif %}
    </div>
  </header>
  <div class="container container--article page__body">
    <aside class="page__rail" aria-label="페이지 정보">
      <span>KLM4416<br>TECHNOLOGY JOURNAL</span>
      <strong>EST. 2026</strong>
    </aside>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
