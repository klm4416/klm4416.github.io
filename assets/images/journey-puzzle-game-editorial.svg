  <text x="160" y="626" fill="#10131a" font-family="Arial, sans-serif" font-size="20">3D ENVIRONMENTAL PUZZLE ADVENTURE</text>
  <text x="160" y="666" fill="#10131a" font-family="Arial, sans-serif" font-size="20">NON-COMBAT / WINDOWS PC / OFFLINE</text>
