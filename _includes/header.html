<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 홈">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <circle cx="16" cy="16" r="15" fill="currentColor"/>
          <path d="M8 15.5c2.3 0 2.3 3 4.6 3s2.3-5 4.7-5 2.3 3 4.7 3" fill="none" stroke="#f8f1e3" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <strong>{{ site.title }} / ARCHIVE</strong>
        <small>PERSONAL DEV STUDIO</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="주요 메뉴">
      <a class="site-nav__link{% if page.url == '/' or page.layout == 'post' %} is-active{% endif %}" href="{{ '/' | relative_url }}#posts"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>INDEX</a>
      <a class="site-nav__link{% if page.url == '/about/' %} is-active{% endif %}" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>ABOUT</a>
      <a class="site-nav__link site-nav__link--intro" href="{{ '/' | relative_url }}?intro=1">REPLAY</a>
      <a class="site-nav__link site-nav__link--icon" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub 프로필 열기">GH ↗</a>
    </nav>
  </div>
</header>
