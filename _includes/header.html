<header class="site-header">
  <div class="edition-bar">
    <div class="container edition-bar__inner">
      <p><strong>SEOUL</strong><span aria-hidden="true">•</span>{{ site.time | date: '%Y.%m.%d' }}</p>
      <p>INDEPENDENT TECHNOLOGY JOURNAL</p>
    </div>
  </div>

  <div class="container masthead">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 홈">
      <strong class="brand__name">{{ site.title }}</strong>
      <span class="brand__descriptor">Technology, systems<br>and field notes</span>
    </a>

    <p class="masthead__statement">Ideas are cheap.<br><strong>Judgement is the work.</strong></p>
  </div>

  <nav class="site-nav" aria-label="주요 메뉴">
    <div class="container site-nav__inner">
      <a class="site-nav__link{% if page.url == '/' or page.layout == 'post' %} is-active{% endif %}" href="{{ '/' | relative_url }}#posts"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>LATEST</a>
      <a class="site-nav__link{% if page.url == '/about/' %} is-active{% endif %}" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>ABOUT</a>
      <a class="site-nav__link" href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a class="site-nav__link site-nav__link--external" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GITHUB <span aria-hidden="true">↗</span></a>
    </div>
  </nav>
</header>
